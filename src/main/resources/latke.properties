#### Public URL (browser-facing, not the Java listen port) ####
# Java's listen port is configured with Starter --listen_port (default 8080).
# Unix socket alternative: local.properties listenSocket or Starter --listen_socket.
# The public URL below remains HTTPS/443 when Nginx uses a local Unix socket upstream.
# For Nginx HTTPS on 443, set serverScheme=https, serverHost=your.domain, serverPort=443.
serverScheme=http
# When omitted, the host is taken from the request's Host header.
#serverHost=localhost
# Public URL port; Latke defaults to 8080 when omitted. 80 and 443 are omitted from generated URLs.
#serverPort=8080

#### Static resource URL (optional) ####
# Keep these keys commented to inherit the corresponding server* values.
# To override, provide actual values; empty values do not mean automatic detection.
#staticServerScheme=http
#staticServerHost=localhost
#staticServerPort=8080

#### Runtime Mode ####
#runtimeMode=DEVELOPMENT
runtimeMode=PRODUCTION
