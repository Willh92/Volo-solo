#
# Description: Solo local environment configurations for docker.
# Version: 3.0.0, Oct 30, 2026
# Author: Liang Ding
#

runtimeDatabase=${RUNTIME_DB}
jdbc.username=${JDBC_USERNAME}
jdbc.password=${JDBC_PASSWORD}
jdbc.driver=${JDBC_DRIVER}
# Recommended MySQL JDBC_URL parameters: &cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&rewriteBatchedStatements=true
jdbc.URL=${JDBC_URL}

# The minConnCnt MUST larger or equal to 3
jdbc.minConnCnt=5
jdbc.maxConnCnt=10

# The specific table name prefix
jdbc.tablePrefix=b3_solo

# Optional Unix socket; mount a private runtime directory and remove --listen_port from the command.
listenSocket=

# Login limits: 5 attempts per account/source and 20 per source within 10 minutes.
# Only exact trusted proxy IPs may supply X-Real-IP; Nginx must overwrite that header.
loginTrustedProxies=127.0.0.1,::1
