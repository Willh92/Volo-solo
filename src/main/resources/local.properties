#### MySQL runtime ####
# MariaDB 11.8.x: keep runtimeDatabase=MYSQL (SQL dialect), and replace only these two JDBC settings:
# jdbc.driver=org.mariadb.jdbc.Driver
# jdbc.URL=jdbc:mariadb://localhost:3306/solo?allowLocalInfile=false
# Keep your existing host, port, database, username/password, table prefix and applicable URL parameters.
# For a remote database with TLS, preserve certificate verification, e.g. sslMode=verify-full.
runtimeDatabase=MYSQL
jdbc.username=root
jdbc.password=123456
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.URL=jdbc:mysql://localhost:3306/solo?useUnicode=yes&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&rewriteBatchedStatements=true

#### H2 runtime ####
#runtimeDatabase=H2
#jdbc.username=root
#jdbc.password=123456
#jdbc.driver=org.h2.Driver
#jdbc.URL=jdbc:h2:~/solo_h2/db;MODE=MYSQL

# The minConnCnt MUST larger or equal to 3
jdbc.minConnCnt=5
jdbc.maxConnCnt=10

# The specific table name prefix
jdbc.tablePrefix=b3_solo

#### Management entry and proxy-aware protection ####
# Optional management prefix. Blank preserves /start and /admin-index.do for existing installations.
# Example: adminPath=/private-panel -> /private-panel/login and /private-panel
# Restart after changing. Old /start, /root and /admin-*.do routes are disabled when customized.
adminPath=
# Optional Unix socket instead of TCP. The Java user must own an existing 0700/0750 directory.
# The supplied volo-unix.init.example creates its dedicated runtime directory at service start.
# Optional octal socket mode after a comma; missing/empty mode defaults to 0660. Restart to change.
# Example: listenSocket=/dev/shm/volo/volo.sock,0660 (do not also pass --listen_port).
# /dev/shm/volo/volo.sock and /dev/shm/volo/volo.sock, both use 0660. Lock files stay 0600.
listenSocket=
# 5 attempts per account and source, 20 total per source, within 10 minutes.
# Shared by login protection and the page-rate WAF (the key name is retained for compatibility).
# Only these exact proxy IPs may supply X-Real-IP. Empty means trust no proxy.
# Nginx must overwrite this header: proxy_set_header X-Real-IP $remote_addr;
# For Unix socket mode, explicitly set loginTrustedProxies=unix to trust that local proxy.
loginTrustedProxies=127.0.0.1,::1

#### Anonymous comment protection (restart after changing) ####
# Shares loginTrustedProxies/X-Real-IP validation; IPv6 addresses in one /64 share a budget.
# Administrators with a valid session can reply without these anonymous limits.
commentMinIntervalSeconds=15
commentRateWindowSeconds=600
commentRateMaxPerIp=5
commentRateMaxPerArticle=30
commentRateMaxGlobal=100

#### Offline province/city IP lookup ####
# Blank uses <base.dir>/geoip. No external service is contacted; restart after changing files.
# The release ZIP includes ip2region_v4.xdb and ip2region_v6.xdb.
# GeoLite2-City.mmdb / GeoIP2-City.mmdb in this directory take precedence.
# GeoLite2-Country.mmdb / GeoIP2-Country.mmdb provide a country fallback; ASN is not a city database.
# Example shared with Nginx: geoipDatabaseDir=/usr/local/nginx-module/geoip
geoipDatabaseDir=
# Set false and restart only to recover from an incorrect country access policy.
# Normal default is true; the policy itself defaults to unrestricted in the admin console.
geoAccessEnabled=true
