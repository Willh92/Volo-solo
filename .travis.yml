language: java
jdk:
  - openjdk17

install:
  - nvm install 22
  - corepack enable
  - yarn install --frozen-lockfile --ignore-scripts --non-interactive
  - yarn build
script:
  - mvn verify -Dlicense.skip=true -B -V -Pci
after_success:
  - mvn jacoco:report coveralls:report -Dlicense.skip=true -Pci
