name: Release-Volo-Docker-Image

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional image tag override (defaults to pom.xml version)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  volo-buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare image registries and tags
        id: prep
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease == true && 'true' || 'false' }}
          INPUT_TAG: ${{ inputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          pom_version=$(node -e 'const xml = require("node:fs").readFileSync("pom.xml", "utf8").replace(/<!--[\s\S]*?-->/g, ""); const top = xml.replace(/<(parent|properties|dependencyManagement|dependencies|build|profiles)\b[\s\S]*?<\/\1>/g, ""); const m = top.match(/<version>([^<]+)<\/version>/); if (!m) process.exit(1); process.stdout.write(m[1].trim());')
          raw_tag="${INPUT_TAG:-${RELEASE_TAG:-$pom_version}}"
          if [[ ! "$raw_tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $raw_tag" >&2
            exit 1
          fi
          clean_tag="${raw_tag#v}"
          ghcr_image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          images=("$ghcr_image")
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            dh_user=$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
            images+=("${dh_user}/volo-solo")
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          tags=()
          for img in "${images[@]}"; do
            tags+=("${img}:${raw_tag}")
            if [ "$clean_tag" != "$raw_tag" ] && [ -n "$clean_tag" ]; then
              tags+=("${img}:${clean_tag}")
            fi
            if [ "$IS_PRERELEASE" != "true" ]; then
              tags+=("${img}:latest")
            fi
          done

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub (optional)
        if: steps.prep.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.prep.outputs.tags }}
