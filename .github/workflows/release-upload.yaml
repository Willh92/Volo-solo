name: Upload-Bolo-Netty-Zip-To-Upyun

on:
  release:
    types:
      - published
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java and Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Build frontend and standalone distribution
        run: |
          corepack enable
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          yarn build
          mvn --batch-mode --no-transfer-progress -Pci -Dlicense.skip=true verify

      - name: Extract version from pom.xml
        id: version
        run: |
          version=$(grep -m 1 '<version>' pom.xml | sed -E 's/.*<version>(.+)<\/version>.*/\1/')
          version_sanitized=$(echo "$version" | sed 's/[.-]/_/g')
          zip_name="bolo_${version_sanitized}.zip"
          echo "Extracted version: $version"
          echo "zip_name=$zip_name" >> $GITHUB_OUTPUT

      - name: Prepare versioned standalone ZIP
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
        run: |
          mkdir -p zip-output
          cp target/bolo-netty.zip "zip-output/$ZIP_NAME"

      - name: Upload bolo_*.zip to UpYun
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
          UPLOAD_URL: ${{ secrets.UPYUN_UPLOAD_URL }}
          UPYUN_OPERATOR: ${{ secrets.UPYUN_OPERATOR }}
          UPYUN_PASSWORD: ${{ secrets.UPYUN_PASSWORD }}
        run: |
          test -n "$UPLOAD_URL" && test -n "$UPYUN_OPERATOR" && test -n "$UPYUN_PASSWORD"
          curl --fail-with-body --silent --show-error -T "zip-output/$ZIP_NAME" \
            "${UPLOAD_URL%/}/$ZIP_NAME" -u "$UPYUN_OPERATOR:$UPYUN_PASSWORD"
