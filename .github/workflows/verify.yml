name: Verify security fixes and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - run: node scripts/fetch-geoip.mjs
      - run: yarn build
      - run: yarn verify:appearance && yarn verify:admin && yarn verify:navigation && yarn verify:kanbanniang
      - run: node scripts/verify-editor-runtime.mjs && node scripts/verify-comments.mjs && node scripts/verify-recommendations.mjs && node scripts/verify-skin-controls.mjs && node scripts/verify-utility-pages.mjs
      - run: mvn --batch-mode --no-transfer-progress -Pci -Dlicense.skip=true verify
